name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      description: 你想解决什么问题？为什么现有功能不够？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 期望方案
      description: 你设想怎么做（不必是最终设计）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 语音/口令
        - LLM/提示词
        - 网络/部署
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: 替代方案
      description: 有没有更简单的绕行办法
