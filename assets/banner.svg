<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#312e81" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="140" fill="#c7d2fe" opacity="0.35"/>
  <circle cx="90" cy="380" r="110" fill="#ddd6fe" opacity="0.35"/>

  <text x="60" y="92" font-size="46" font-weight="800" fill="#0f172a">小爱音箱 × AI 语音桥接</text>
  <text x="60" y="138" font-size="21" fill="#475569">让闲置的小爱音箱，成为任意 AI 的语音入口 —— 语音下任务，音箱播报反馈</text>

  <!-- 链路节点 -->
  <g filter="url(#shadow)">
    <rect x="60"  y="212" width="176" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="296" y="212" width="176" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="532" y="212" width="176" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="768" y="212" width="176" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="1004" y="212" width="136" height="86" rx="14" fill="url(#accent)"/>
  </g>

  <!-- 图标（纯几何） -->
  <g stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M92 246 h10 v20 a9 9 0 0 0 18 0 v-20 h10 v20 a19 19 0 0 1 -38 0 z"/>
    <path d="M115 275 v10 M100 285 h30"/>
  </g>
  <g stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="325" y="238" width="26" height="34" rx="4"/>
    <path d="M331 246 h14 M331 253 h14 M331 260 h9"/>
  </g>
  <g stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M560 255 l16 -14 v28 z M584 241 a20 20 0 0 1 0 28"/>
  </g>
  <g stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="800" y="236" width="30" height="38" rx="5"/>
    <path d="M808 246 h14 M808 254 h14 M808 262 h9"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1055 268 a18 18 0 1 1 36 0"/>
    <path d="M1073 286 v12 M1060 298 h26"/>
  </g>

  <g font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">
    <text x="148" y="328">你说一句话</text>
    <text x="384" y="328">xiaomusic 捕获</text>
    <text x="620" y="328">桥接 + LLM</text>
    <text x="856" y="328">TTS 下发</text>
  </g>
  <g font-size="13" fill="#64748b" text-anchor="middle">
    <text x="148" y="350">小爱同学唤醒</text>
    <text x="384" y="350">语音转文字</text>
    <text x="620" y="350">理解并生成回答</text>
    <text x="856" y="350">音箱出声</text>
    <text x="1072" y="328" fill="#ffffff" font-weight="700">任意 AI</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arw)">
    <path d="M238 255 h54"/><path d="M474 255 h54"/><path d="M710 255 h54"/><path d="M946 255 h54"/>
  </g>
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 底部标签 -->
  <g font-size="15" fill="#4338ca">
    <rect x="60" y="382" width="150" height="28" rx="14" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="135" y="401" text-anchor="middle">任意音箱型号</text>
    <rect x="222" y="382" width="150" height="28" rx="14" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="297" y="401" text-anchor="middle">任意 LLM</text>
    <rect x="384" y="382" width="164" height="28" rx="14" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="466" y="401" text-anchor="middle">网络自适应</text>
    <rect x="560" y="382" width="152" height="28" rx="14" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="636" y="401" text-anchor="middle">零硬编码</text>
  </g>
</svg>
